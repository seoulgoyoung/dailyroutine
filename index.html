<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데일리 루틴 & 투두</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--text:#1d2330;--sub:#7a8294;--line:#e5e8ee;--accent:#3b6cf6;--ok:#1fa971}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161c;--card:#1c2029;--text:#e9ecf2;--sub:#8b94a7;--line:#2c3240;--accent:#7a9bff;--ok:#3ccf91}}
:root[data-theme="dark"]{--bg:#13161c;--card:#1c2029;--text:#e9ecf2;--sub:#8b94a7;--line:#2c3240;--accent:#7a9bff;--ok:#3ccf91}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
.date{color:var(--sub);font-size:.9rem;margin:0}
h1{font-size:1.4rem;margin:2px 0 4px}
#sync{font-size:.8rem;color:var(--sub);margin:0 0 16px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:400;color:var(--sub);font-size:.82rem}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-right:2px}
.row span{flex:1;word-break:break-word}
.row.done span{color:var(--sub);text-decoration:line-through}
.x{background:none;border:0;color:var(--sub);font-size:.95rem;cursor:pointer;padding:2px 6px;line-height:1}
.ed{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.sm{border:1px solid var(--line);background:none;color:var(--text);border-radius:8px;padding:5px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.sm.p{background:var(--accent);border-color:var(--accent);color:#fff}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.add button{padding:0 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
.empty{color:var(--sub);font-size:.9rem;padding:8px 0}
#banner{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:-6px 0 16px;font-size:.9rem;color:var(--accent)}
details{border-bottom:1px solid var(--line);padding:10px 0}
details:last-child{border-bottom:0}
summary{cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;list-style:none}
summary::-webkit-details-marker{display:none}
summary small{color:var(--sub)}
details .row{padding:6px 0 6px 4px;border-bottom:0}
.sep{font-size:.8rem;color:var(--sub);margin:8px 0 0 4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note{font-size:.82rem;color:var(--sub);margin:6px 0 0}
</style>
</head>
<body>
<main>
<p class="date" id="date"></p>
<h1>오늘도 차근차근 ✅</h1>
<p id="sync">이 기기에만 저장 중</p>
<div id="banner" hidden></div>

<section>
<h2>매일 루틴 <small id="rc"></small></h2>
<div class="bar"><i id="rbar"></i></div>
<div id="routines"></div>
<div class="add"><input id="rin" placeholder="매일 할 일 추가 (예: 물 마시기)" maxlength="60"><button id="rbtn">추가</button></div>
</section>

<section>
<h2>앞으로 할 일 <small id="tc"></small></h2>
<div id="todos"></div>
<div class="add"><input id="tin" placeholder="할 일 추가" maxlength="80"><button id="tbtn">추가</button></div>
</section>

<section>
<h2>날짜별 기록 <small>10/5부터 · 체크박스를 눌러 수정</small></h2>
<div id="hist"></div>
</section>

<section>
<h2>데이터 보관</h2>
<div class="tools"><button class="sm" id="bk">백업 파일 내려받기</button><button class="sm" id="im">백업 불러오기</button></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<p class="note" id="bkmsg">가끔 백업 파일을 받아 두면 더 안전해요.</p>
</section>
</main>
<script>
var KEY="daily-simple-v1",START="2026-10-05",EDIT=null;
function norm(o){o=(o&&typeof o==="object")?o:{};o.routines=o.routines||[];o.todos=o.todos||[];o.checks=o.checks||{};o.updatedAt=o.updatedAt||0;return o}
var S=norm(null);
try{var raw=localStorage.getItem(KEY);if(raw)S=norm(JSON.parse(raw))}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
var DB=null,UID=null,tm=null;
function setSync(t){document.getElementById("sync").textContent=t}
function local(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function push(){
if(!DB||!UID)return;clearTimeout(tm);
tm=setTimeout(function(){
DB.collection("data/users/"+UID).doc("state").set({json:JSON.stringify(S),updatedAt:S.updatedAt})
.then(function(){setSync("☁️ 계정에 자동 저장됨")})
.catch(function(){setSync("⚠️ 서버 저장 실패 (이 기기에는 저장됨)")});
},600)}
function save(){S.updatedAt=Date.now();local();push()}
async function initCloud(){
try{
if(!window.claude||!window.claude.use)return;
var user=await window.claude.use("user"),db=await window.claude.use("db");
if(!user||!db)return;
UID=await user.id();DB=db;
var snap=await db.collection("data/users/"+UID).doc("state").get();
if(snap.exists){var r=snap.data();
if(r&&r.json&&(r.updatedAt||0)>(S.updatedAt||0)){S=norm(JSON.parse(r.json));local();render();setSync("☁️ 계정에 자동 저장됨");return}}
setSync("☁️ 계정에 자동 저장됨");push();
}catch(e){}}
function fmt(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function today(){return fmt(new Date())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function vis(r,k){return (!r.createdOn||r.createdOn<=k)&&(!r.deletedOn||k<r.deletedOn)}
function isOn(k,id){return (S.checks[k]||[]).indexOf(id)>-1}
var days=["일","월","화","수","목","금","토"],n=new Date();
document.getElementById("date").textContent=n.getFullYear()+"년 "+(n.getMonth()+1)+"월 "+n.getDate()+"일 ("+days[n.getDay()]+")";
function editRow(text){return '<input class="ed" id="ed" value="'+esc(text)+'" maxlength="80"><button class="sm p" data-save="1">저장</button><button class="sm" data-cancel="1">취소</button>'}
function rowR(r,k,editable){var d=isOn(k,r.id),ing=editable&&EDIT&&EDIT.t==="r"&&EDIT.k===r.id;
return '<div class="row'+(d?" done":"")+'"><input type="checkbox" data-r="'+r.id+'" data-k="'+k+'"'+(d?" checked":"")+'>'+
(ing?editRow(r.text):'<span>'+esc(r.text)+'</span>'+(editable?'<button class="x" data-re="'+r.id+'" aria-label="수정">✏️</button><button class="x" data-rx="'+r.id+'" aria-label="삭제">×</button>':''))+'</div>'}
function render(){
var t=today();
var vr=S.routines.filter(function(r){return vis(r,t)});
document.getElementById("routines").innerHTML=vr.map(function(r){return rowR(r,t,true)}).join("")||'<div class="empty">매일 반복할 루틴을 추가해 보세요.</div>';
var rd=vr.filter(function(r){return isOn(t,r.id)}).length;
document.getElementById("rc").textContent=rd+" / "+vr.length;
document.getElementById("rbar").style.width=(vr.length?rd/vr.length*100:0)+"%";
document.getElementById("todos").innerHTML=S.todos.map(function(x,i){
var ing=EDIT&&EDIT.t==="t"&&EDIT.k===i;
return '<div class="row'+(x.done?" done":"")+'"><input type="checkbox" data-t="'+i+'"'+(x.done?" checked":"")+'>'+
(ing?editRow(x.text):'<span>'+esc(x.text)+'</span><button class="x" data-te="'+i+'" aria-label="수정">✏️</button><button class="x" data-tx="'+i+'" aria-label="삭제">×</button>')+'</div>'}).join("")||'<div class="empty">아직 할 일이 없어요.</div>';
document.getElementById("tc").textContent="남은 "+S.todos.filter(function(x){return !x.done}).length+"개";
var bn=document.getElementById("banner");
if(t<START){var dd=Math.round((new Date(START+"T00:00:00")-new Date(t+"T00:00:00"))/86400000);bn.hidden=false;bn.textContent="📅 10월 5일부터 날짜별 기록이 시작돼요 (D-"+dd+")"}else{bn.hidden=true}
renderHist(t);
var ed=document.getElementById("ed");if(ed){ed.focus();ed.setSelectionRange(ed.value.length,ed.value.length)}
}
function renderHist(t){
var el=document.getElementById("hist");
if(t<START){el.innerHTML='<div class="empty">10월 5일부터 여기에 날짜별 체크 기록이 쌓여요.</div>';return}
var first=!el.innerHTML,op={};
Array.prototype.forEach.call(el.querySelectorAll("details[open]"),function(x){op[x.getAttribute("data-k")]=1});
var out="",d=new Date(t+"T00:00:00"),s=new Date(START+"T00:00:00");
for(;d>=s;d.setDate(d.getDate()-1)){
var k=fmt(d),v=S.routines.filter(function(r){return vis(r,k)}),dn=v.filter(function(r){return isOn(k,r.id)}).length;
var td=S.todos.filter(function(x){return x.doneAt===k});
var body=v.map(function(r){return rowR(r,k,false)}).join("");
if(td.length)body+='<div class="sep">완료한 할 일</div>'+td.map(function(x){return '<div class="row done"><input type="checkbox" checked disabled><span>'+esc(x.text)+'</span></div>'}).join("");
if(!body)body='<div class="empty">그날은 등록된 루틴이 없어요.</div>';
var open=first?k===t:!!op[k];
out+='<details data-k="'+k+'"'+(open?" open":"")+'><summary><b>'+(d.getMonth()+1)+'/'+d.getDate()+' ('+days[d.getDay()]+')</b><small>루틴 '+dn+'/'+v.length+'</small></summary>'+body+'</details>';
}
el.innerHTML=out;
}
function commitEdit(){
var ed=document.getElementById("ed");if(!ed||!EDIT)return;
var s=ed.value.trim();
if(s){if(EDIT.t==="r"){S.routines.forEach(function(r){if(r.id===EDIT.k)r.text=s})}else if(S.todos[EDIT.k]){S.todos[EDIT.k].text=s}save()}
EDIT=null;render()}
document.addEventListener("click",function(e){var a=e.target;if(!a.dataset)return;
if(a.dataset.rx){S.routines.forEach(function(r){if(r.id===a.dataset.rx)r.deletedOn=today()});EDIT=null;save();render()}
else if(a.dataset.tx!==undefined){S.todos.splice(+a.dataset.tx,1);EDIT=null;save();render()}
else if(a.dataset.re){EDIT={t:"r",k:a.dataset.re};render()}
else if(a.dataset.te!==undefined){EDIT={t:"t",k:+a.dataset.te};render()}
else if(a.dataset.save){commitEdit()}
else if(a.dataset.cancel){EDIT=null;render()}});
document.addEventListener("keydown",function(e){if(e.target&&e.target.id==="ed"){if(e.key==="Enter"){e.preventDefault();commitEdit()}else if(e.key==="Escape"){EDIT=null;render()}}});
document.addEventListener("change",function(e){var a=e.target;if(!a.dataset)return;
if(a.dataset.r){var k=a.dataset.k,c=S.checks[k]=S.checks[k]||[],i=c.indexOf(a.dataset.r);
if(a.checked&&i<0)c.push(a.dataset.r);if(!a.checked&&i>-1)c.splice(i,1);save();render()}
else if(a.dataset.t!==undefined){var tt=S.todos[+a.dataset.t];tt.done=a.checked;tt.doneAt=a.checked?today():null;save();render()}});
function addR(){var v=document.getElementById("rin"),s=v.value.trim();if(!s)return;S.routines.push({id:"r"+Date.now(),text:s,createdOn:today()});v.value="";save();render()}
function addT(){var v=document.getElementById("tin"),s=v.value.trim();if(!s)return;S.todos.push({text:s,done:false});v.value="";save();render()}
document.getElementById("rbtn").onclick=addR;document.getElementById("tbtn").onclick=addT;
document.getElementById("rin").onkeydown=function(e){if(e.key==="Enter")addR()};
document.getElementById("tin").onkeydown=function(e){if(e.key==="Enter")addT()};
function msg(t){document.getElementById("bkmsg").textContent=t}
document.getElementById("bk").onclick=async function(){
try{var dl=await window.claude.use("downloads");if(!dl){msg("이 환경에서는 백업 내려받기를 쓸 수 없어요.");return}
await dl.save({filename:"routine-backup-"+today()+".json",data:JSON.stringify(S,null,1)});msg("백업 파일을 저장했어요.")}
catch(e){msg("백업을 저장하지 못했어요.")}};
document.getElementById("im").onclick=function(){document.getElementById("file").click()};
document.getElementById("file").onchange=function(e){
var f=e.target.files&&e.target.files[0];if(!f)return;
var rd=new FileReader();
rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||!Array.isArray(o.routines))throw 0;
try{localStorage.setItem(KEY+"-prev",JSON.stringify(S))}catch(x){}
S=norm(o);save();render();msg("백업을 불러왔어요.")}catch(x){msg("올바른 백업 파일이 아니에요.")}};
rd.readAsText(f);e.target.value=""};
render();initCloud();
</script>
</body>
</html>
